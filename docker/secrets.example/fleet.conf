# Reviewer fleet — one row per unit:  <worker-id> <codex-account-dir>
#
# The account dir is relative to docker/secrets/. Provision it with:
#   CODEX_HOME=docker/secrets/codex-account-a codex login --device-auth
#
# Comment a row out to pull that unit from the fleet. Its named volumes
# persist, so uncommenting restores the warm dind build cache and local
# clones. Commenting out a unit tears down its container, which kills any
# review in flight on it — park during a quiet moment. A parked unit's
# /shared/pool/<id>/ dir survives on the shared claims volume, so pool_status
# keeps reporting it as "not running" in every paused-comment posted to a real
# PR; un-parking is free, but to retire an account for good also
# `rm -rf` its /shared/pool/<id>/.
#
# Worker ids are explicit, not positional: commenting out row 3 leaves 4 and 5
# with their own identities, so [wN] log tags and pool_status clauses do not
# shift. Ids key /shared/pool/<id>/, so they must be unique.
#
# After editing:  just fleet && docker compose up -d --remove-orphans &&
# sudo systemctl start knightwatch-reviewer.service   (`up -d` touches only the
# units whose definition changed, so adding one leaves the rest reviewing;
# `--remove-orphans` is what actually tears down a commented-out unit, and it
# has to be here because `start` on the already-active unit is a no-op, so
# ExecStart's own copy of the flag never fires. `restart` would bounce the
# whole fleet and kill reviews in flight.)

1  codex-account-a
2  codex-account-b
